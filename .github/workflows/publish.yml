name: publish

# main -> GitHub Pages gallery with every generated file.
# tag v* -> GitHub Release with a zip of the build.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:10.0
      options: --user root
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run kicrate build --out build
      - run: uv run kicrate drc --out build
      - run: uv run kicrate site --build build --out site
      - name: Zip build
        run: |
          apt-get update -qq && apt-get install -y -qq zip >/dev/null
          cd build && zip -qr ../kicrate-build.zip .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: kicrate-build
          path: kicrate-build.zip

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kicrate-build
      - uses: softprops/action-gh-release@v2
        with:
          files: kicrate-build.zip
          generate_release_notes: true
