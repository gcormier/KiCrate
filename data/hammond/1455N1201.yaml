      shape: rect
      size: [103.124, 53.086]
      corner_radius: 3.99
    holes:
      - {at: [-47.498, -22.733], drill: 4.19, countersink: [5.842, 82], screw: '#6 Taptight'}
      - {at: [47.498, -22.733], drill: 4.19, countersink: [5.842, 82], screw: '#6 Taptight'}
      - {at: [47.498, 22.733], drill: 4.19, countersink: [5.842, 82], screw: '#6 Taptight'}
      - {at: [-47.498, 22.733], drill: 4.19, countersink: [5.842, 82], screw: '#6 Taptight'}
