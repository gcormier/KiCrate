    outline:
      shape: rect
      size: [119.0, 99.0]
    keepouts:
      - {edge: y_min, width: 2.0, side: both, reason: inside card slot}
      - {edge: y_max, width: 2.0, side: both, reason: inside card slot}
    slots:
      slot_width: 2.0
      pcb_thickness: [0.8, 1.6]
      levels: [6.29, 9.79, 13.29, 16.79, 20.29, 23.79, 27.29, 30.79, 34.29, 37.79, 41.29]
    notes:
      - Slots are 2.0 wide, 2.5 deep, on a 3.5 pitch (manufacturer DWG, 1:1 mm).
      - Slot levels are the slot's lower face above the inside floor.
panels:
  - id: end
    faces: [front, back]
    material: Aluminium
    thickness: 1.5
