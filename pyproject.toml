[project]
name = "kicrate"
version = "0.1.0"
description = "PCB outlines, KiCad boards and panel files for off-the-shelf electronic enclosures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "ezdxf>=1.3",
    "pymupdf>=1.28.2",
]

[project.scripts]
kicrate = "kicrate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
